name: CI (Mac)

on:
  push:
    branches: [main]
    paths: ["mac/**", "bench/**", ".github/workflows/ci-mac.yml"]
  pull_request:
    paths: ["mac/**", "bench/**", ".github/workflows/ci-mac.yml"]

permissions:
  contents: read

jobs:
  core:
    # macOS 27 with Xcode 27 (a public preview image at the time of writing); the package needs both.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: mac/Packages/AsistanKit

  app:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      # MLX compiles Metal shaders; the toolchain is a separate download.
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: xcodegen generate
      # Unsigned: this only checks that the app builds.
      - run: >
          xcodebuild -project Asistan.xcodeproj -scheme Asistan -configuration Debug
          -derivedDataPath build/DerivedData.noindex CODE_SIGNING_ALLOWED=NO build
