name: Release

# One tag, one release: the Mac DMG, the Windows installer and both Linux AppImages, published together as a draft.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^ *CFBundleShortVersionString: "\(.*\)"$/\1/p' project.yml)
          if [[ "v$version" != "${{ github.ref_name }}" ]]; then
            echo "Tag ${{ github.ref_name }} but project.yml says $version"; exit 1
          fi
      - run: brew install xcodegen
      # MLX compiles Metal shaders; the toolchain is a separate download.
      - run: xcodebuild -downloadComponent MetalToolchain
      # Without a Developer ID certificate on the runner the app is signed ad hoc, as in local releases.
      - run: scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: mac/build/release/Bilge-*.dmg

  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked --extra app
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = uv run python -c "from importlib.metadata import version; print(version('bilge'))"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} but pyproject says $version" }
      - name: Vulkan SDK, for whisper.cpp on graphics cards
        env:
          VULKAN_VERSION: "1.4.313.2"
          # The SHA-256 LunarG publishes at sdk.lunarg.com/sdk/sha/<version>/windows/<file>.txt
          VULKAN_SHA256: "34a921d951858274ca8e470e9d0a3b7624db41216b3908ccea9f73c8a1b7500e"
        run: |
          $installer = "$env:RUNNER_TEMP\vulkansdk.exe"
          curl.exe -fsSL --retry 5 --retry-all-errors -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $env:VULKAN_SHA256) { throw "Vulkan SDK checksum mismatch" }
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK install failed" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\Bin"
      - run: powershell -File packaging\whisper\build-windows.ps1
      - run: |
          New-Item -ItemType Directory -Force build | Out-Null
          uv run python packaging/make_icon.py build/bilge.ico
          uv run pyinstaller packaging/bilge.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = uv run python -c "from importlib.metadata import version; print(version('bilge'))"
          & $iscc /DVersion=$version packaging\windows\bilge.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/Bilge-Setup-*.exe

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            base: ubuntu:22.04
          - runner: ubuntu-24.04-arm
            base: ubuntu:24.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bilge-appimage --build-arg BASE=${{ matrix.base }} packaging/linux
      - run: mkdir -p dist && docker run --rm -v "$PWD":/src:ro -v "$PWD/dist":/out bilge-appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: desktop/dist/*.AppImage

  publish:
    needs: [mac, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Bilge ${{ github.ref_name }}
          draft: true
          files: artifacts/*
