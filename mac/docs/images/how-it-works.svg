<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8FA3"/>
    </marker>
    <style>
      .box { stroke-width: 1.5; }
      .t { font-size: 15px; font-weight: 600; fill: #1D2040; text-anchor: middle; }
      .s { font-size: 12px; fill: #4A4F6A; text-anchor: middle; }
      .line { stroke: #8A8FA3; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <g>
    <rect class="box" x="10" y="20" width="200" height="74" rx="14" fill="#E8E9FB" stroke="#B9BCF2"/>
    <text class="t" x="110" y="52">Mikrofon</text>
    <text class="s" x="110" y="73">ses Mac'ten çıkmaz</text>

    <rect class="box" x="255" y="20" width="200" height="74" rx="14" fill="#E8E9FB" stroke="#B9BCF2"/>
    <text class="t" x="355" y="52">Ses algılama</text>
    <text class="s" x="355" y="73">konuşma var mı? (VAD)</text>

    <rect class="box" x="500" y="20" width="200" height="74" rx="14" fill="#FFF1D9" stroke="#F2CB86"/>
    <text class="t" x="600" y="52">“Bilge” dedi mi?</text>
    <text class="s" x="600" y="73">demediyse hiçbir şey olmaz</text>

    <rect class="box" x="745" y="20" width="200" height="74" rx="14" fill="#E8E9FB" stroke="#B9BCF2"/>
    <text class="t" x="845" y="52">Konuşma tanıma</text>
    <text class="s" x="845" y="73">Apple Dikte ya da Whisper</text>
  </g>

  <path class="line" d="M210 57 H251"/>
  <path class="line" d="M455 57 H496"/>
  <path class="line" d="M700 57 H741"/>
  <path class="line" d="M845 94 V130 H600 V166"/>

  <g>
    <rect class="box" x="500" y="170" width="200" height="88" rx="14" fill="#E3F4F1" stroke="#9DD6CB"/>
    <text class="t" x="600" y="203">Komutu anlama</text>
    <text class="s" x="600" y="224">Apple cihaz içi model</text>
    <text class="s" x="600" y="242">+ isteğe bağlı MLX modeli</text>

    <rect class="box" x="255" y="170" width="200" height="88" rx="14" fill="#E3F4F1" stroke="#9DD6CB"/>
    <text class="t" x="355" y="203">İşi yapma</text>
    <text class="s" x="355" y="224">50'den fazla araç</text>
    <text class="s" x="355" y="242">riskli işte önce sesli onay</text>

    <rect class="box" x="10" y="170" width="200" height="88" rx="14" fill="#E8E9FB" stroke="#B9BCF2"/>
    <text class="t" x="110" y="203">Sesli yanıt</text>
    <text class="s" x="110" y="224">Supertonic-3, Mac'te üretilir</text>
    <text class="s" x="110" y="242">“Bilge, dur” ile kesilir</text>
  </g>

  <path class="line" d="M500 214 H459"/>
  <path class="line" d="M255 214 H214"/>

  <text x="480" y="305" font-size="12.5" fill="#8A8FA3" text-anchor="middle">İnternet yalnızca istenen veriler (hava, döviz, haber, web sayfası) ve model indirmeleri için kullanılır.</text>
</svg>
