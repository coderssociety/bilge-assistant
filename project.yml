name: Asistan
options:
  bundleIdPrefix: com.vrnsoft
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  AsistanKit:
    path: Packages/AsistanKit
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"

targets:
  Asistan:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes: ["Info.plist", "Asistan.entitlements"]
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Bilge
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Bilge, uyandırma kelimesini ve komutlarını duymak için mikrofonu kullanır. Ses kaydı saklanmaz ve Mac'inden dışarı çıkmaz.
        NSSpeechRecognitionUsageDescription: Bilge, Türkçe komutlarını cihaz üzerinde yazıya dökmek için konuşma tanımayı kullanır.
        NSAppleEventsUsageDescription: Bilge, senin isteğinle uygulamaları kontrol etmek (müzik, notlar, Mail, Mesajlar, tarayıcı) için Apple Events kullanır. Gönderme işlemleri her zaman onayınla yapılır.
        NSCalendarsFullAccessUsageDescription: Bilge, takvimindeki etkinlikleri okumak ve senin onayınla yenilerini eklemek için takvime erişir.
        NSRemindersFullAccessUsageDescription: Bilge, anımsatıcılarını okumak ve senin onayınla yenilerini eklemek için anımsatıcılara erişir.
        NSContactsUsageDescription: Bilge, sorduğunda birinin telefonunu ya da e-postasını bulmak ve senin onayınla mesaj göndermek için kişilerine erişir.
    entitlements:
      path: App/Resources/Asistan.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.personal-information.calendars: true
    dependencies:
      - package: AsistanKit
        product: AsistanCore
      - package: FluidAudio
        product: FluidAudio
      - package: ArgmaxOSS
        product: WhisperKit
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vrnsoft.asistan
        PRODUCT_NAME: Bilge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Resources/Asistan.entitlements
